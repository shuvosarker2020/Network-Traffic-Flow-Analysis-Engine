# AegisFlow High-Throughput Linux Kernel UDP & Network Tuning
# Place in /etc/sysctl.d/99-aegisflow.conf and apply with: sudo sysctl -p /etc/sysctl.d/99-aegisflow.conf

# Maximum and default socket receive buffer size (64MB)
net.core.rmem_max = 67108864
net.core.rmem_default = 33554432

# Maximum and default socket send buffer size (32MB)
net.core.wmem_max = 33554432
net.core.wmem_default = 16777216

# UDP socket memory limits [min, pressure, max] in OS memory pages
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384
net.ipv4.udp_mem = 262144 524288 1048576

# Maximum number of packets queued on the input network interface
net.core.netdev_max_backlog = 50000

# Increase maximum open files and connection backlog
net.core.somaxconn = 65535
fs.file-max = 2097152
