# AegisFlow Nginx Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/aegisflow and symlink to /etc/nginx/sites-enabled/

upstream aegisflow_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name aegisflow.internal;

    # Redirect all HTTP traffic to HTTPS (Optional for internal TLS)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    # Gzip compression for high-speed UI delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    location / {
        proxy_pass http://aegisflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint for real-time telemetry pulse and attack ticks
    location /ws/ {
        proxy_pass http://aegisflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
